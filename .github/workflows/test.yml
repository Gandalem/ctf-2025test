name: CTF solver tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AES-GCM test dependency
        run: python -m pip install 'cryptography>=42,<50'
      - name: Ensure PHP CLI is available
        run: command -v php || (sudo apt-get update && sudo apt-get install -y php-cli)
      - name: Install ECB oracle dependency
        run: python -m pip install 'pycryptodome>=3.20,<4'
      - name: Install original Stonks Flask dependency
        run: python -m pip install 'Flask==3.1.1'
      - name: Install CMS challenge verifier
        run: python -m pip install 'endesive==2.18.5' 'asn1crypto>=1.5,<2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
      - name: Run original Gomail Go integration tests
        working-directory: data/gomail/app
        run: go test -v ./...
      - name: Install offline PCAP forensic reader
        run: python -m pip install 'dpkt>=1.9.8,<2'
      - name: Download original public DUCTF Fishy Website PCAP
        run: |
          curl -fsSL --retry 2 https://raw.githubusercontent.com/DownUnderCTF/Challenges_2025_Public/main/misc/fishy_website/publish/capture.pcapng -o /tmp/ductf-fishy-capture.pcapng
          test "$(wc -c </tmp/ductf-fishy-capture.pcapng)" -gt 1000000
      - name: Install audio and browser regression dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'playwright>=1.52,<2'
          python -m playwright install --with-deps chromium
      - name: Download original public DUCTF BeepBeep WAV
        run: |
          curl -fsSL --retry 2 https://raw.githubusercontent.com/DownUnderCTF/Challenges_2025_Public/main/misc/beepbeep/src/beepbeep.wav -o /tmp/ductf-beepbeep.wav
          test "$(wc -c </tmp/ductf-beepbeep.wav)" -gt 4000000
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original Express 4 and Express 5 challenge packages
        run: |
          npm install --prefix data/request_handling --no-audit --no-fund 'express@4' 'handlebars@4.7.8'
          npm install --prefix data/more_request_handling --no-audit --no-fund 'express@5' handlebars
      - name: Validate algorithm outputs
        env:
          DUCTF_FISHY_PCAP: /tmp/ductf-fishy-capture.pcapng
          DUCTF_BEEP_WAV: /tmp/ductf-beepbeep.wav
        run: python -m unittest discover -s tests -v
      - name: Print recovered flags
        run: |
          python -m solvers.dtmf data/dtmf.txt
          python -m solvers.caterpillar data/caterpillar_output.txt
          python -m solvers.zeus data/zeus_main.c
          python -m solvers.skippy data/skippy_main.c
          python -m solvers.mini_me data/mini_me_sourcemap.json
          python -m solvers.vimfu data/vimfu_key.txt data/vimfu_lock.txt
          python -m solvers.rocky data/rocky_main.c data/rocky_candidates.txt
          python -m solvers.loadme data/loadme_passwords.spm.b64
          python -m solvers.bilingual data/bilingual_published.py data/bilingual_helper.cpp
          python -m solvers.corporate_cliche data/corporate_email_server.c data/corporate_email_server.elf.b64
          python -m solvers.clickme data/clickme_app.swift
          python -m solvers.philtered data/philtered
          python -m solvers.crackme data/crackme.swift
          python -m solvers.ecb_a_tron data/ecb_a_tron_main.py
          python -m solvers.horoscopes data/horoscopes
          python -m solvers.yet_another_login data/yet_another_login_chall.py
          python -m solvers.godot_tiles data/godot_tile_map_layer.gd
          python -m solvers.secure_email_attachments data/secure_email_attachments_main.go
          python -m solvers.stonks data/stonks/stonks.py data/stonks/templates
          python -m solvers.speak_friend_enter data/speak_friend_server.py
          python -m solvers.dualzip data/dualzip_app.py /tmp/ctf-dualzip-synthetic
          python -m solvers.gomail data/gomail/app/session/claims.go data/gomail/app/handlers.go
          python -m solvers.certvalidated data/certvalidated/certvalidated.py data/certvalidated/root.crt
          python -m solvers.fishy_website /tmp/ductf-fishy-capture.pcapng data/fishy_client.py
          python -m solvers.beepbeep /tmp/ductf-beepbeep.wav
          python -m solvers.mutant data/mutant/main.js data/mutant/index.html
          python -m solvers.good_game_spawn_point data/good_game_spawn_point/chal.py
          python -m solvers.file_upload data/file_upload/appupload.py data/file_upload/appview.py data/file_upload/templates
          python -m solvers.request_handling data/request_handling/Dockerfile
          python -m solvers.more_request_handling data/more_request_handling/Dockerfile
          python -m solvers.kick_the_bucket data/kick_the_bucket/s3_resource_policy.json data/kick_the_bucket/s3_presigned_url.txt
          python -m solvers.legendary data/legendary/original_solve.sh data/legendary/api.php data/legendary/index.php data/legendary/nginx.conf
      - name: Reconstruct original public Scrapbooking challenge image
        run: |
          curl -fsSL --retry 2 https://raw.githubusercontent.com/DownUnderCTF/Challenges_2025_Public/main/misc/scrapbooking/publish/warped.png -o /tmp/ductf-warped.png
          python -m solvers.scrapbooking /tmp/ductf-warped.png /tmp/ductf-scrapbooking
          python -c "from pathlib import Path; p=list(Path('/tmp/ductf-scrapbooking').glob('image*.png')); assert len(p)==3, len(p); print('Verified original challenge: 3 valid PNG files', [x.stat().st_size for x in p])"
